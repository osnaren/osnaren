<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Coda:wght@400;800&amp;display=swap');

            @keyframes orbit {
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes counter {
                to {
                    transform: rotate(-360deg);
                }
            }

            @keyframes pulse {

                0%,
                100% {
                    opacity: 0.8;
                }

                50% {
                    opacity: 1;
                }
            }

            .o {
                transform-origin: 100px 100px;
                animation: orbit 22s linear infinite;
            }

            .c {
                transform-origin: 100px 100px;
                animation: counter 30s linear infinite;
            }

            .p {
                animation: pulse 3s ease-in-out infinite;
            }
        </style>
