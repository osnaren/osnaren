<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes counter { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { r: 6; opacity: 0.85; } 50% { r: 8; opacity: 1; } }
    .o { transform-origin: 100px 100px; animation: orbit 20s linear infinite; }
    .c { transform-origin: 100px 100px; animation: counter 28s linear infinite; }
    .p { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Orbits -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="#555" stroke-width="0.8" opacity="0.35"/>

  <!-- Orbiting dots -->
  <g class="o">
    <circle cx="172" cy="100" r="6" fill="#f97316" class="p"/>
  </g>
  <g class="c">
    <circle cx="48" cy="100" r="5.5" fill="#65a30d" opacity="0.75"/>
  </g>
  <g class="o">
    <circle cx="100" cy="28" r="2.5" fill="#555" opacity="0.5"/>
  </g>
  <g class="c">
    <circle cx="100" cy="172" r="2.5" fill="#555" opacity="0.5"/>
  </g>
  <g class="o">
    <circle cx="155" cy="145" r="2" fill="#555" opacity="0.4"/>
  </g>

  <!-- Centre: OS -->
  <text x="93" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#e5e5e5" letter-spacing="-2">OS</text>
  <text x="126" y="88" font-family="monospace" font-size="22" font-weight="500" fill="#f97316">n</text>
</svg>
